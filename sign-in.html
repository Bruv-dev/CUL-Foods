<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUL Foods</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/sign-in.css">
    <link rel="stylesheet" href="assets/css/mobile.css">
    <script src="assets/js/script.js" defer></script>
    </head>
    <body>
        <form id="loginForm">
            <div class="form-title">
                <h1>Sign-in</h1>
                <a href="index.html">Go back to home page</a>
            </div>
            <div class="login-form-group">
                <label for="firstname">First Name:</label>
                <input type="text" id="firstname" name="first_name" required>
            </div>
            <div class="login-form-group">
                <label for="lastname">Last Name:</label>
                <input type="text" id="lastname" name="last_name" required>
            </div>
            <div class="login-form-group">
                <label for="gender">Gender:</label>
                <div class="gender-group">
                    <label class="radio-label"><input type="radio" id="male" name="gender" value="M" required> Male</label>
                    <label class="radio-label"><input type="radio" id="female" name="gender" value="F" required> Female</label>
                </div>
            </div>
            <div class="login-form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>
            <div class="login-form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="login-form-group">
                <button type="submit" id="submit">Submit</button>
            </div>
            <p>If you dont have an account yet, <a href="#sign-up.html">Sign up here</a></p>
        </form>
    </body>
</html>
