<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUL Foods</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/sign-up.css">
    <link rel="stylesheet" href="assets/css/mobile.css">
    <script src="assets/js/script.js" defer></script>
    </head>
    <body>
        <form id="signForm" action="sign-up.php" method="post">
            <div class="form-title">
                <h1>Sign-up</h1>
                <a href="index.html">Go back to home page</a>
            </div>
            <div class="sign-form-group">
                <label for="firstname">First Name:</label>
                <input type="text" id="firstname" name="first_name" required>
            </div>
            <div class="sign-form-group">
                <label for="lastname">Last Name:</label>
                <input type="text" id="lastname" name="last_name" required>
            </div>
            <div class="sign-form-group">
                <label for="gender">Gender:</label>
                <div class="gender-group">
                    <label class="radio-label"><input type="radio" id="male" name="gender" value="Male" required> Male</label>
                    <label class="radio-label"><input type="radio" id="female" name="gender" value="Female" required> Female</label>
                </div>
            </div>
            <div class="sign-form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>
            <div class="sign-form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="sign-form-group">
                <label for="phone_number">Phone Number:</label>
                <input type="tel" id="phonenumber" name="phone_number" required>
            </div>
            <div class="sign-form-group">
                <button type="submit" id="submit">Sign Up</button>
            </div>
            <p class="login-link">If you have an account already, <a href="sign-in.html">Sign in here</a></p>
            <footer>
                <p>&copy; Oguama Anthony</p>
            </footer>
        </form>
    </body>
</html>
